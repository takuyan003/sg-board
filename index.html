<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SG Board</title>
<style>
  :root{color-scheme:light;--bg:#f6f5f1;--card:#fff;--line:#e7e4dc;--ink:#2b2b2b;--mut:#8d8a82;--green:#1b5e20}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 40px;max-width:560px;margin:0 auto;line-height:1.6}
  h1{font-size:17px;font-weight:800}
  .sub{font-size:11px;color:var(--mut);margin-bottom:14px}
  .today{background:linear-gradient(135deg,#1b2a4a,#2e4370);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
  .today .l{font-size:11px;letter-spacing:.2em;color:#e8c15a;font-weight:700;margin-bottom:6px}
  .today .t{font-size:17px;font-weight:800}
  .today .n{font-size:12.5px;color:#c9d2e6;margin-top:6px}
  .tabs{display:flex;gap:6px;margin:12px 0 10px}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:999px;font-size:12.5px;font-weight:700;background:#ecebe5;color:var(--mut);cursor:pointer;user-select:none}
  .tab.on{background:var(--ink);color:#fff}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .item .cb{font-size:19px;line-height:1.4}
  .item .tt{font-size:14px;font-weight:600}
  .item .nt{font-size:12px;color:var(--mut);margin-top:1px}
  .item.done .tt{text-decoration:line-through;color:var(--mut)}
  .dd{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
  .st .v{font-size:20px;font-weight:800;color:var(--green)}
  .st .l{font-size:10px;color:var(--mut)}
  .sec{font-size:12px;font-weight:700;color:var(--mut);margin:16px 0 8px}
  .empty{font-size:12.5px;color:var(--mut);text-align:center;padding:18px 0}
  .addrow{display:flex;gap:8px;margin-bottom:12px}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;background:#fff;outline:none}
  .addrow button{border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:0 18px;cursor:pointer}
  .del{margin-left:auto;color:#c9c5bb;font-size:13px;padding:2px 6px}
  /* heatmap */
  .hm-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
  .hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
  .hm div{width:12px;height:12px;border-radius:3px;background:#edebe4}
  .hm .l1{background:#c8e6c9}.hm .l2{background:#81c784}.hm .l3{background:#2e7d32}
  .hm-leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mut);margin-top:8px;justify-content:flex-end}
  .hm-leg span{width:10px;height:10px;border-radius:2px;display:inline-block}
  .ylog .item{cursor:default}
  .foot{margin-top:24px;font-size:10px;color:#bbb7ad;text-align:center}
</style>
</head>
<body>
  <h1>🏗️ SG Board</h1>
  <div class="sub">やる事とやった事。タップで完了⇄戻す。自分で追加した分はこの端末に保存。</div>

  <div class="today" id="todayCard">
    <div class="l">今日の1件</div>
    <div class="t" id="todayT">—</div>
    <div class="n" id="todayN"></div>
  </div>

  <div class="stats">
    <div class="st"><div class="v" id="sYear">0</div><div class="l">年間積み上げ日</div></div>
    <div class="st"><div class="v" id="sStreak">0</div><div class="l">連続記録</div></div>
    <div class="st"><div class="v" id="sTodo">0</div><div class="l">やる事</div></div>
    <div class="st"><div class="v" id="sMikiri">0</div><div class="l">見送り判断</div></div>
  </div>

  <div class="tabs">
    <div class="tab on" data-v="todo">やる事</div>
    <div class="tab" data-v="done">やった事</div>
    <div class="tab" data-v="year">1年</div>
  </div>

  <div id="vTodo">
    <div class="addrow"><input id="newTask" type="text" placeholder="今日やることを追加" enterkeyhint="done"><button id="addBtn">追加</button></div>
    <div id="listTodo"></div>
  </div>

  <div id="vDone" style="display:none"><div id="listDone"></div></div>

  <div id="vYear" style="display:none">
    <div class="sec">積み上げヒートマップ（直近1年・濃いほど多い）</div>
    <div class="hm-wrap"><div class="hm" id="hm"></div>
      <div class="hm-leg">少 <span style="background:#edebe4"></span><span style="background:#c8e6c9"></span><span style="background:#81c784"></span><span style="background:#2e7d32"></span> 多</div>
    </div>
    <div class="sec">月別まとめ</div>
    <div id="monthly" class="ylog"></div>
  </div>

  <div class="sec">目利きログ</div>
  <div id="mikiriList"></div>

  <div class="foot">STAYGOLD internal board / updated 2026-11-07 v2</div>

<script>
// ===== 正本データ（Claudeが夜の報告で更新してpush）=====
const TODAY = { id:"t1", title:"Y社の面談を予約する", note:"Webから予約可。物件なしでOK" };
const TASKS = [
  { id:"t1", title:"Y社の面談を予約する", note:"融資相談の進め方を聞く" },
  { id:"t2", title:"No.824の件で担当者に電話", note:"返事確認→現況→指値の感触の3点" },
  { id:"t3", title:"税理士に決算の質問5点をメール", note:"1通だけ" },
  { id:"t4", title:"FAXサービスの初回ログイン", note:"契約成立まで" },
  { id:"t5", title:"銀行1行に属性の事前相談", note:"物件なしでOKと伝える" },
];
const DONE_LOG = [
  // {date:"2026-11-09", title:"..."} ← Claudeが追記（正本・端末をまたいで共有される）
];
const MIKIRI = [
  // {date:"2026-11-09", text:"No.xxx 擁壁ありで見送り"}
];

// ===== ローカル状態 =====
const K_DONE="sg_done_v2";   // {id: "YYYY-MM-DD"} 完了日付き
const K_CUSTOM="sg_custom_v1"; // [{id,title,created}]
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let doneMap = jget(K_DONE,{});
let custom = jget(K_CUSTOM,[]);
const saveAll=()=>{localStorage.setItem(K_DONE,JSON.stringify(doneMap));localStorage.setItem(K_CUSTOM,JSON.stringify(custom));};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const $=id=>document.getElementById(id);

function allTasks(){ return [...TASKS, ...custom.map(c=>({...c, note:"自分で追加", custom:true}))]; }

function dayCounts(){
  const m={};
  Object.values(doneMap).forEach(d=>{ m[d]=(m[d]||0)+1; });
  DONE_LOG.forEach(e=>{ m[e.date]=(m[e.date]||0)+1; });
  MIKIRI.forEach(e=>{ m[e.date]=(m[e.date]||0)+0.5; }); // 見送り判断も薄く加点
  return m;
}

function render(){
  const lt=$("listTodo"), ld=$("listDone");
  lt.innerHTML=""; ld.innerHTML="";
  let nTodo=0;
  allTasks().forEach(t=>{
    const done = !!doneMap[t.id];
    const el=document.createElement("div");
    el.className="item"+(done?" done":"");
    el.innerHTML=`<div class="cb">${done?"✅":"⬜"}</div><div style="flex:1"><div class="tt">${esc(t.title)}</div><div class="nt">${esc(t.note||"")}</div>${done?`<div class="dd">積み上げた！（${doneMap[t.id]}）</div>`:""}</div>${t.custom?'<div class="del" data-del="'+t.id+'">✕</div>':""}`;
    el.onclick=(ev)=>{
      if(ev.target.dataset.del){ custom=custom.filter(c=>c.id!==ev.target.dataset.del); delete doneMap[ev.target.dataset.del]; saveAll(); render(); return; }
      done ? delete doneMap[t.id] : doneMap[t.id]=todayStr();
      saveAll(); render();
    };
    (done?ld:lt).appendChild(el);
    if(!done) nTodo++;
  });
  DONE_LOG.forEach(d=>{
    const el=document.createElement("div"); el.className="item done"; el.style.cursor="default";
    el.innerHTML=`<div class="cb">✅</div><div><div class="tt">${esc(d.title)}</div><div class="nt">${d.date}</div></div>`;
    ld.appendChild(el);
  });
  if(!lt.children.length) lt.innerHTML='<div class="empty">やる事は空っぽ。ぜんぶ積み上げた🎉</div>';
  if(!ld.children.length) ld.innerHTML='<div class="empty">まだこれから。1件やれば今日は積み上げた日。</div>';

  // stats
  const counts=dayCounts(); const days=Object.keys(counts).filter(d=>counts[d]>=1);
  $("sYear").textContent=days.length;
  $("sTodo").textContent=nTodo;
  $("sMikiri").textContent=MIKIRI.length;
  // streak（今日から遡って連続した積み上げ日）
  let streak=0; const d=new Date();
  for(;;){ const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if((counts[s]||0)>=1){streak++; d.setDate(d.getDate()-1);} else { if(streak===0 && s===todayStr()){d.setDate(d.getDate()-1); continue;} break; } }
  $("sStreak").textContent=streak;

  renderYear(counts);
  const ml=$("mikiriList");
  ml.innerHTML = MIKIRI.length?"":'<div class="empty">見送り判断と理由がここに貯まる＝目利きの言語化</div>';
  MIKIRI.slice().reverse().forEach(m=>{ const e=document.createElement("div"); e.className="item"; e.style.cursor="default"; e.innerHTML=`<div class="cb">🔍</div><div><div class="tt" style="font-weight:500">${esc(m.text)}</div><div class="nt">${m.date}</div></div>`; ml.appendChild(e); });
}

function renderYear(counts){
  const hm=$("hm"); hm.innerHTML="";
  const end=new Date(); const start=new Date(); start.setDate(end.getDate()-364);
  start.setDate(start.getDate()-start.getDay()); // 週頭に揃える
  const monthly={};
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const c=counts[s]||0;
    const cell=document.createElement("div");
    cell.title=s+(c?`: ${c}件`:"");
    if(c>=3)cell.className="l3"; else if(c>=2)cell.className="l2"; else if(c>=1)cell.className="l1";
    hm.appendChild(cell);
    if(c>=1){ const mk=s.slice(0,7); monthly[mk]=(monthly[mk]||0)+1; }
  }
  const mo=$("monthly"); mo.innerHTML="";
  const keys=Object.keys(monthly).sort().reverse();
  if(!keys.length){ mo.innerHTML='<div class="empty">まだ記録なし。今日から1マス目。</div>'; return; }
  keys.forEach(k=>{ const e=document.createElement("div"); e.className="item"; e.style.cursor="default";
    e.innerHTML=`<div class="cb">📅</div><div><div class="tt">${k.replace("-","年")}月 — ${monthly[k]}日積み上げ</div></div>`; mo.appendChild(e); });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// add task
$("addBtn").onclick=()=>{ const v=$("newTask").value.trim(); if(!v)return;
  custom.push({id:"c"+Date.now(), title:v, created:todayStr()}); $("newTask").value=""; saveAll(); render(); };
$("newTask").addEventListener("keydown",e=>{ if(e.key==="Enter")$("addBtn").click(); });

// tabs
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  $("vTodo").style.display = t.dataset.v==="todo"?"":"none";
  $("vDone").style.display = t.dataset.v==="done"?"":"none";
  $("vYear").style.display = t.dataset.v==="year"?"":"none";
});

$("todayT").textContent=TODAY.title; $("todayN").textContent=TODAY.note||"";
render();
</script>
</body>
</html>

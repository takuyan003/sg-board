<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SG Board</title>
<style>
  :root{color-scheme:light;--bg:#f6f5f1;--card:#fff;--line:#e7e4dc;--ink:#2b2b2b;--mut:#8d8a82;--green:#1b5e20;--gold:#b8860b}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 40px;max-width:560px;margin:0 auto;line-height:1.6}
  h1{font-size:17px;font-weight:800;letter-spacing:.02em}
  .sub{font-size:11px;color:var(--mut);margin-bottom:14px}
  .today{background:linear-gradient(135deg,#1b2a4a,#2e4370);color:#fff;border-radius:16px;padding:18px;margin-bottom:16px}
  .today .l{font-size:11px;letter-spacing:.2em;color:#e8c15a;font-weight:700;margin-bottom:6px}
  .today .t{font-size:17px;font-weight:800}
  .today .n{font-size:12.5px;color:#c9d2e6;margin-top:6px}
  .tabs{display:flex;gap:8px;margin:14px 0 10px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:999px;font-size:13px;font-weight:700;background:#ecebe5;color:var(--mut);cursor:pointer;user-select:none}
  .tab.on{background:var(--ink);color:#fff}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .item .cb{font-size:19px;line-height:1.4}
  .item .tt{font-size:14px;font-weight:600}
  .item .nt{font-size:12px;color:var(--mut);margin-top:1px}
  .item.done{opacity:.85}
  .item.done .tt{text-decoration:line-through;color:var(--mut)}
  .dd{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
  .stats{display:flex;gap:8px;margin-bottom:14px}
  .st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .st .v{font-size:20px;font-weight:800;color:var(--green)}
  .st .l{font-size:10px;color:var(--mut)}
  .sec{font-size:12px;font-weight:700;color:var(--mut);margin:16px 0 8px}
  .empty{font-size:12.5px;color:var(--mut);text-align:center;padding:20px 0}
  .foot{margin-top:24px;font-size:10px;color:#bbb7ad;text-align:center}
</style>
</head>
<body>
  <h1>🏗️ SG Board</h1>
  <div class="sub">やる事とやった事。タップで完了⇄戻す（この端末に保存）。正本の更新は夜の報告でClaudeが反映。</div>

  <div class="today" id="todayCard">
    <div class="l">今日の1件</div>
    <div class="t" id="todayT">—</div>
    <div class="n" id="todayN"></div>
  </div>

  <div class="stats">
    <div class="st"><div class="v" id="sDone">0</div><div class="l">やった事</div></div>
    <div class="st"><div class="v" id="sTodo">0</div><div class="l">やる事</div></div>
    <div class="st"><div class="v" id="sMikiri">0</div><div class="l">見送り判断</div></div>
  </div>

  <div class="tabs">
    <div class="tab on" id="tabTodo">やる事</div>
    <div class="tab" id="tabDone">やった事</div>
  </div>

  <div id="listTodo"></div>
  <div id="listDone" style="display:none"></div>

  <div class="sec">目利きログ</div>
  <div id="mikiriList"></div>

  <div class="foot">STAYGOLD internal board / updated 2026-11-07</div>

<script>
// ===== データ（正本はClaudeが更新してpush。idは変えない）=====
const TODAY = { id:"t1", title:"Y社の面談を予約する", note:"Webから予約可。物件なしでOK" };
const TASKS = [
  { id:"t1", title:"Y社の面談を予約する", note:"融資相談の進め方を聞く" },
  { id:"t2", title:"No.824の件で担当者に電話", note:"返事確認→現況→指値の感触の3点" },
  { id:"t3", title:"税理士に決算の質問5点をメール", note:"1通だけ" },
  { id:"t4", title:"FAXサービスの初回ログイン", note:"契約成立まで" },
  { id:"t5", title:"銀行1行に属性の事前相談", note:"物件なしでOKと伝える" },
];
const DONE_LOG = [
  // {date:"11/09", title:"..."}  ← Claudeが夜の報告で追記
];
const MIKIRI = [
  // {date:"11/09", text:"No.xxx 擁壁ありで見送り"}
];

// ===== ローカル完了状態 =====
const KEY="sg_done_v1";
const local = new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const save = () => localStorage.setItem(KEY, JSON.stringify([...local]));

const $ = id => document.getElementById(id);
function render(){
  const lt=$("listTodo"), ld=$("listDone");
  lt.innerHTML=""; ld.innerHTML="";
  let nTodo=0, nDone=DONE_LOG.length;
  TASKS.forEach(t=>{
    const isDone = local.has(t.id);
    const el=document.createElement("div");
    el.className="item"+(isDone?" done":"");
    el.innerHTML=`<div class="cb">${isDone?"✅":"⬜"}</div><div><div class="tt">${t.title}</div><div class="nt">${t.note||""}</div>${isDone?'<div class="dd">積み上げた！</div>':""}</div>`;
    el.onclick=()=>{ isDone?local.delete(t.id):local.add(t.id); save(); render(); };
    (isDone?ld:lt).appendChild(el);
    isDone?nDone++:nTodo++;
  });
  DONE_LOG.forEach(d=>{
    const el=document.createElement("div");
    el.className="item done";
    el.innerHTML=`<div class="cb">✅</div><div><div class="tt">${d.title}</div><div class="nt">${d.date}</div></div>`;
    ld.appendChild(el);
  });
  if(!lt.children.length) lt.innerHTML='<div class="empty">やる事は空っぽ。ぜんぶ積み上げた🎉</div>';
  if(!ld.children.length) ld.innerHTML='<div class="empty">まだこれから。1件やれば今日は積み上げた日。</div>';
  $("sDone").textContent=nDone; $("sTodo").textContent=nTodo; $("sMikiri").textContent=MIKIRI.length;
  const ml=$("mikiriList");
  ml.innerHTML = MIKIRI.length ? "" : '<div class="empty">見送り判断と理由がここに貯まる＝目利きの言語化</div>';
  MIKIRI.forEach(m=>{ const e=document.createElement("div"); e.className="item"; e.innerHTML=`<div class="cb">🔍</div><div><div class="tt" style="font-weight:500">${m.text}</div><div class="nt">${m.date}</div></div>`; ml.appendChild(e); });
}
$("todayT").textContent=TODAY.title; $("todayN").textContent=TODAY.note||"";
$("tabTodo").onclick=()=>{ $("tabTodo").classList.add("on"); $("tabDone").classList.remove("on"); $("listTodo").style.display=""; $("listDone").style.display="none"; };
$("tabDone").onclick=()=>{ $("tabDone").classList.add("on"); $("tabTodo").classList.remove("on"); $("listDone").style.display=""; $("listTodo").style.display="none"; };
render();
</script>
</body>
</html>
